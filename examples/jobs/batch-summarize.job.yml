# yaml-language-server: $schema=../../schemas/v3/job.yaml
provider: anthropic
model: anthropic/claude-sonnet-4-6

batch:
  files: "input/*.txt"
  # resume: true
  concurrency: 3

task: |
  Summarize the following document. The file path is {{file}}.
  Provide a concise summary with key points and write it into the "output/"
  directory, named "summary-" followed by the input file's base name.

tools:
  - write-file
